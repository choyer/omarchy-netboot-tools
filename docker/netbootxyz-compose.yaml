networks:
  pxe-net:
    driver: macvlan
    driver_opts:
      parent: enp9s0f0
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.1

services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz
    container_name: netbootxyz
    networks:
      pxe-net:
        ipv4_address: 192.168.4.10
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/PixoNet-Block/netbootxyz/config:/config
      - /mnt/PixoNet-Block/netbootxyz/assets:/assets
